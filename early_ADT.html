<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>攝護腺癌術後追蹤預測器</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f8;--card:#fff;--ink:#14232e;--mute:#5d6f7c;--line:#d5dee4;--a:#0f6b7a;--a2:#b4541a;--ok:#2f7d4f;--mid:#b07d10;--hi:#b0302a;--chip:#e6eef2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--card:#17252e;--ink:#e6eef2;--mute:#93a6b2;--line:#2b3d48;--a:#5cc3d4;--a2:#f0a06a;--ok:#6fcf97;--mid:#e6b94a;--hi:#f07f77;--chip:#22343f}}
:root[data-theme="dark"]{--bg:#0f1a21;--card:#17252e;--ink:#e6eef2;--mute:#93a6b2;--line:#2b3d48;--a:#5cc3d4;--a2:#f0a06a;--ok:#6fcf97;--mid:#e6b94a;--hi:#f07f77;--chip:#22343f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.45rem;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--mute);margin:0 0 16px;font-size:.88rem}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-weight:600;border-radius:8px 8px 0 0;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--a);border-bottom:3px solid var(--a);background:var(--card)}
.tabs button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:1rem;margin:0 0 10px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input,select{width:100%;padding:8px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.psad{margin-top:10px;padding:8px 10px;background:var(--chip);border-radius:6px;font-size:.88rem}
.post{display:none}.show-post .post{display:block}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;color:#fff;font-size:.9rem}
.big{font-size:1.9rem;font-weight:700;line-height:1.2}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.9rem}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.lg{display:flex;gap:14px;font-size:.8rem;color:var(--mute);margin:4px 0 0}
.lg i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}
.rec{margin-top:10px;padding:10px 12px;border-left:4px solid var(--a);background:var(--chip);border-radius:4px}
.note{color:var(--mute);font-size:.78rem;margin-top:16px;line-height:1.6}
svg{width:100%;height:auto;display:block}
</style></head>
<body><main id="app">
<h1>攝護腺癌術後追蹤預測器</h1>
<p class="sub">依台中榮總泌尿科根治性攝護腺切除資料(n=624,無術前 ADT)建立的回溯性模型。預測 BCR-free 與「BCR 或開始 ADT」的無事件存活,並估計兩年內提早使用 ADT 的機率。</p>
<div class="tabs" role="tablist">
<button role="tab" id="t-pre" aria-selected="true">術前</button>
<button role="tab" id="t-post" aria-selected="false">術後</button></div>
<div class="grid">
<section class="card"><h2>輸入資料</h2>
<div class="row"><div><label for="psa">PSA (ng/mL)</label><input id="psa" type="number" step="0.1" min="0" value="8"></div>
<div><label for="vol">攝護腺體積 (mL)</label><input id="vol" type="number" step="1" min="5" value="30"></div></div>
<label for="psad">PSAD(自動計算,可直接修改)</label><input id="psad" type="number" step="0.01" min="0.01" value="0.27">
<div class="psad" id="psadmsg"></div>
<label for="ct">影像 T 分期</label><select id="ct"><option value="0">cT2</option><option value="1">cT3a(含未分亞型)</option><option value="2">cT3b / cT4</option></select>
<label for="rk">NCCN 風險組</label><select id="rk"><option value="0">Low / 中風險</option><option value="1">High</option><option value="2">Very high</option></select>
<div class="post"><label for="mp">手術切緣</label><select id="mp"><option value="0">陰性</option><option value="1">陽性</option></select>
<label for="pt">病理 T 分期</label><select id="pt"><option value="0">pT2 以下</option><option value="1">pT3 以上(ECE 或 SVI)</option></select>
<label for="gg">病理 Grade Group</label><select id="gg"><option value="0">GG 1–3</option><option value="1">GG 4–5</option></select>
<label for="pn">淋巴結</label><select id="pn"><option value="0">pN0 / 未廓清</option><option value="1">pN1</option></select></div>
</section>
<section class="card" aria-live="polite"><h2 id="ttl">術前預測</h2>
<div><span class="badge" id="tier"></span></div>
<div class="big" id="big"></div><div style="color:var(--mute);font-size:.85rem">5 年內 BCR 或開始 ADT 的機率</div>
<svg id="ch" viewBox="0 0 360 190" role="img" aria-label="無事件存活曲線"></svg>
<div class="lg"><span><i style="background:var(--a)"></i>BCR-free</span><span><i style="background:var(--a2)"></i>BCR 或 ADT-free</span></div>
<table><thead><tr><th>無事件存活</th><th>1 年</th><th>3 年</th><th>5 年</th></tr></thead><tbody id="tb"></tbody></table>
<div>兩年內提早使用 ADT 的機率:<b id="adt"></b></div>
<div class="rec" id="rec"></div>
</section></div>
<p class="note" id="note"></p>
</main>
<script>
const MD={"n":624,"bcr_ev":82,"comp_ev":176,"models":{"pre":{"cols":["lpsad","c3a","c3b","rHR","rVHR"],"bcr":{"b":[0.0778,0.6394,0.6393,0.3447,0.6549],"mu":[-1.9772,0.3061,0.0593,0.2356,0.0817],"S0":[0.9924,0.9763,0.9336,0.8978,0.856],"cv_c":0.6,"hr":{"lpsad":1.08,"c3a":1.9,"c3b":1.9,"rHR":1.41,"rVHR":1.92}},"comp":{"b":[0.3156,0.5631,0.9234,0.5296,1.1645],"mu":[-1.9772,0.3061,0.0593,0.2356,0.0817],"S0":[0.8955,0.8384,0.7885,0.7569,0.7107],"cv_c":0.744,"hr":{"lpsad":1.37,"c3a":1.76,"c3b":2.52,"rHR":1.7,"rVHR":3.2}},"adt":{"b0":-1.7142,"b":[0.4179,1.0397,1.5002,0.7855,1.3823],"auc":0.802}},"post":{"cols":["lpsad","c3a","c3b","rHR","rVHR","mp","pT3","pGG4","pN1"],"bcr":{"b":[-0.0318,0.4412,0.1933,0.0813,0.2755,0.4955,0.6876,0.4662,-0.0947],"mu":[-1.9772,0.3061,0.0593,0.2356,0.0817,0.5032,0.4327,0.1378,0.0673],"S0":[0.9933,0.9789,0.9407,0.9086,0.8694],"cv_c":0.637,"hr":{"lpsad":0.97,"c3a":1.55,"c3b":1.21,"rHR":1.08,"rVHR":1.32,"mp":1.64,"pT3":1.99,"pGG4":1.59,"pN1":0.91}},"comp":{"b":[0.1826,0.1773,0.2148,0.1347,0.471,0.6043,1.0551,1.027,0.5678],"mu":[-1.9772,0.3061,0.0593,0.2356,0.0817,0.5032,0.4327,0.1378,0.0673],"S0":[0.9209,0.8713,0.8237,0.7907,0.7395],"cv_c":0.803,"hr":{"lpsad":1.2,"c3a":1.19,"c3b":1.24,"rHR":1.14,"rVHR":1.6,"mp":1.83,"pT3":2.87,"pGG4":2.79,"pN1":1.76}},"adt":{"b0":-3.1729,"b":[0.2904,0.6241,0.5618,0.1721,0.3307,1.0686,1.125,1.4192,0.8023],"auc":0.865}}},"ranges":{"psad":[0.029,1.671]}};
const $=id=>document.getElementById(id);let mode='pre';
function setMode(m){mode=m;$('app').classList.toggle('show-post',m==='post');$('t-pre').setAttribute('aria-selected',m==='pre');$('t-post').setAttribute('aria-selected',m==='post');$('ttl').textContent=m==='pre'?'術前預測':'術後預測(含病理)';calc()}
$('t-pre').onclick=()=>setMode('pre');$('t-post').onclick=()=>setMode('post');
function fromPsa(){const p=+$('psa').value,v=+$('vol').value;if(p>0&&v>0){$('psad').value=(p/v).toFixed(2)}calc()}
$('psa').oninput=fromPsa;$('vol').oninput=fromPsa;
['psad','ct','rk','mp','pt','gg','pn'].forEach(i=>$(i).oninput=calc);
function vals(){const c=+$('ct').value,r=+$('rk').value,p=Math.max(+$('psad').value||0.01,0.001);
return{lpsad:Math.log2(p),c3a:c==1?1:0,c3b:c==2?1:0,rHR:r==1?1:0,rVHR:r==2?1:0,mp:+$('mp').value,pT3:+$('pt').value,pGG4:+$('gg').value,pN1:+$('pn').value,psad:p}}
function surv(m,k,x){const o=m[k];let lp=0;m.cols.forEach((c,i)=>lp+=o.b[i]*(x[c]-o.mu[i]));const e=Math.exp(lp);return o.S0.map(s=>Math.pow(s,e))}
function calc(){const m=MD.models[mode],x=vals();
if(mode==='pre'){x.mp=x.pT3=x.pGG4=x.pN1=0}
const sc=surv(m,'comp',x),sb=surv(m,'bcr',x),pc=v=>v>.98?'>98%':v<.02?'<2%':(v*100).toFixed(0)+'%';
const r5=1-sc[4];$('big').textContent=pc(r5);
const t=r5<.3?['低風險','var(--ok)']:r5<.6?['中風險','var(--mid)']:['高風險','var(--hi)'];
$('tier').textContent=t[0];$('tier').style.background=t[1];
$('tb').innerHTML='<tr><td>BCR-free</td>'+[0,2,4].map(i=>'<td>'+pc(sb[i])+'</td>').join('')+'</tr><tr><td>BCR 或 ADT-free</td>'+[0,2,4].map(i=>'<td>'+pc(sc[i])+'</td>').join('')+'</tr>';
let z=m.adt.b0;m.cols.forEach((c,i)=>z+=m.adt.b[i]*x[c]);const pa=1/(1+Math.exp(-z));$('adt').textContent=pc(pa);
const txt=r5<.3?'無事件存活機率高,依常規追蹤 PSA 即可,不需提早 ADT。':r5<.6?'風險中等,建議縮短 PSA 追蹤間隔,並討論是否需要輔助治療。':'高風險:類似病人過去多半提早開始 ADT(或輔助治療),建議多專科討論是否提早介入。';
$('rec').innerHTML='<b>參考建議:</b>'+txt+(pa>=.5?'<br>此組合兩年內提早 ADT 的機率超過一半。':'');
const W=360,H=190,L=34,B=24,T=8,R=8,X=y=>L+(W-L-R)*y/5,Y=v=>T+(H-T-B)*(1-v);
let s='';for(let v=0;v<=1.001;v+=.25)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="var(--mute)">${Math.round(v*100)}</text>`;
for(let y=0;y<=5;y++)s+=`<text x="${X(y)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--mute)">${y}年</text>`;
const pl=(a,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.4" points="${[1,...a].map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
$('ch').innerHTML=s+pl(sb,'var(--a)')+pl(sc,'var(--a2)');
const p=x.psad;$('psadmsg').textContent='PSAD = '+p.toFixed(2)+(p<MD.ranges.psad[0]||p>MD.ranges.psad[1]?'(超出建模資料範圍 '+MD.ranges.psad.join('–')+',結果僅供參考)':'');
$('note').innerHTML='模型:Cox 比例風險(log2 PSAD、影像 T、風險組;術後另加切緣、pT3、pGG4–5、pN1)。樣本 '+MD.n+' 人,BCR '+MD.bcr_ev+' 例,複合事件 '+MD.comp_ev+' 例;5 折交叉驗證 C-index:複合終點 術前 '+MD.models.pre.comp.cv_c+' / 術後 '+MD.models.post.comp.cv_c+',單看 BCR 僅 '+MD.models.pre.bcr.cv_c+' / '+MD.models.post.bcr.cv_c+'。<br>限制:回溯性單中心、未外部驗證;「BCR 或 ADT」含醫師開始 ADT 的決策,反映風險加治療傾向,不能證明提早 ADT 有益或有害;追蹤中位數約 4 年,5 年以後為外推。本工具僅供研究與臨床討論參考,不可取代醫療判斷。';
}
fromPsa();setMode('pre');
</script></body></html>
