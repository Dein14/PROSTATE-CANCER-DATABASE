<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="apple-touch-icon" href="IMG_1194.jpeg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GU</title>
<style>
    :root {
        --nejm-red: #B31B1B;
        --ink: #1a1a1a;
        --ink-soft: #4a4a4a;
        --rule: #d8d4cc;
        --paper: #f7f1e3;
        --c-prostate: #B31B1B;
        --c-rcc: #2B5D6B;
        --c-uc: #A6741C;
    }

    * { box-sizing: border-box; }

    body {
        font-family: Georgia, "Noto Serif TC", "PT Serif", serif;
        background-color: var(--paper);
        color: var(--ink);
        padding: 0;
        margin: 0;
    }

    .masthead {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px 0;
    }

    .kicker {
        font-family: Georgia, "Noto Serif TC", serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--ink);
        text-align: center;
        margin: 0 0 8px;
    }

    .issue-line {
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        color: var(--ink-soft);
        text-align: center;
        margin: 0 0 20px;
    }

    .double-rule {
        border: none;
        border-top: 3px solid var(--nejm-red);
        border-bottom: 1px solid var(--nejm-red);
        height: 4px;
        margin: 0 0 28px;
    }

    .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 24px 60px;
    }

    #search {
        padding: 11px 18px;
        width: 100%;
        font-family: "Helvetica Neue", Arial, sans-serif;
        border: 1px solid var(--rule);
        border-radius: 2px;
        background: #fff;
        font-size: 14px;
        margin-bottom: 36px;
        outline: none;
        color: var(--ink);
        transition: border-color 0.2s;
    }
    #search::placeholder { color: #999; }
    #search:focus { border-color: var(--nejm-red); }

    #list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 16px;
    }

    #list li { margin: 0; }

    #list a {
        --accent: var(--nejm-red);
        display: flex;
        align-items: center;
        gap: 18px;
        background: #fff;
        border: 1px solid var(--rule);
        border-left: 6px solid var(--accent);
        border-radius: 4px;
        padding: 20px 22px;
        text-decoration: none;
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    #list a:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(0,0,0,0.1);
        border-left-color: var(--accent);
    }

    #list a:active {
        transform: translateY(0px);
        box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    }

    .entry-badge {
        flex: 0 0 auto;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Noto Serif TC", serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.02em;
    }

    .entry-body {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
    }

    .entry-tag {
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
    }

    .entry-title {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.3;
    }

    .entry-arrow {
        flex: 0 0 auto;
        font-size: 20px;
        color: var(--accent);
        opacity: 0.55;
        transition: transform 0.15s ease, opacity 0.15s ease;
    }

    #list a:hover .entry-arrow {
        transform: translateX(4px);
        opacity: 1;
    }

    footer {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 24px 40px;
        text-align: center;
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 11px;
        color: #999;
        border-top: 1px solid var(--rule);
        line-height: 1.8;
    }

    @media (max-width: 600px) {
        .masthead { padding: 32px 18px 0; }
        .container { padding: 0 18px 40px; }
        .entry-title { font-size: 17px; }
        #list a { padding: 16px; gap: 14px; }
        .entry-badge { width: 44px; height: 44px; font-size: 11px; }
        .entry-arrow { display: none; }
    }
</style>
</head>
<body>

<div class="masthead">
    <p class="kicker">機智 GU 住院醫師</p>
    <p class="issue-line">Genitourinary Oncology — Trial Reference Index</p>
    <hr class="double-rule">
</div>

<div class="container">
    <input id="search" placeholder="輸入關鍵字篩選報告…">
    <ul id="list">
        <li>
            <a href="prostate_cancer_clinical_trials.html" style="--accent: var(--c-prostate);">
                <span class="entry-badge">CaP</span>
                <span class="entry-body">
                    <span class="entry-tag">Clinical Trials</span>
                    <span class="entry-title">攝護腺癌</span>
                </span>
                <span class="entry-arrow">→</span>
            </a>
        </li>
        <li>
            <a href="Renal_Cell_Carcinoma_Clinical_Trial.html" style="--accent: var(--c-rcc);">
                <span class="entry-badge">RCC</span>
                <span class="entry-body">
                    <span class="entry-tag">Clinical Trials</span>
                    <span class="entry-title">腎細胞癌</span>
                </span>
                <span class="entry-arrow">→</span>
            </a>
        </li>
        <li>
            <a href="Urothelial_Carcinoma_Clinical_Trial.html" style="--accent: var(--c-uc);">
                <span class="entry-badge">UC</span>
                <span class="entry-body">
                    <span class="entry-tag">Clinical Trials</span>
                    <span class="entry-title">泌尿上皮癌</span>
                </span>
                <span class="entry-arrow">→</span>
            </a>
        </li>
    </ul>
</div>

<footer>Internal reference only · Not for clinical decision-making without primary source verification<br>Maintained by Y.T. Huang</footer>

<script>
let input = document.getElementById("search");
input.addEventListener("keyup", function(){
    let keyword = this.value.toLowerCase();
    document.querySelectorAll("#list li").forEach(li => {
        li.style.display =
            li.innerText.toLowerCase().includes(keyword) ? "" : "none";
    });
});
</script>
</body>
</html>
