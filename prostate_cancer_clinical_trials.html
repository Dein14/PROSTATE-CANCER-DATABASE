<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prostate Cancer Clinical Trial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --nejm-red:#A6192E;
    --nejm-red-dark:#7C1121;
    --nejm-red-tint:#FBEAEC;
    --ink:#1B1B1B;
    --ink-soft:#4A4842;
    --gray:#7A776E;
    --gray-line:#DFDACB;
    --paper:#FCFBF6;
    --paper-card:#FFFFFF;
    --paper-alt:#F4F1E7;
    --green:#1E6B3C;
    --green-tint:#E7F2EA;
    --blue:#28507A;
    --blue-tint:#EAF0F7;
    --amber-tint:#FBF3E3;
    --amber:#8A5A00;

    /* stately per-category colors */
    --c-nmCRPC: #2C4A6E;        /* deep slate blue */
    --c-nmCRPC-tint: #E7ECF3;
    --c-mCSPC: #285C4D;         /* deep forest teal-green */
    --c-mCSPC-tint: #E6EFEC;
    --c-mCRPC: #6E2743;         /* deep wine burgundy */
    --c-mCRPC-tint: #F1E6EB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Source Serif 4',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  a{color:inherit;}

  /* ---------- Sticky top group (single sticky container avoids offset/overlap bugs on mobile) ---------- */
  .sticky-top{
    position:sticky; top:0; z-index:50;
    background:var(--paper);
  }

  header.masthead{
    background:var(--paper-card);
    border-bottom:3px solid var(--nejm-red);
    padding:14px 16px 12px;
  }
  .masthead-inner{max-width:720px; margin:0 auto;}
  .kicker{
    font-family:'Noto Sans TC',sans-serif;
    font-size:10.5px; letter-spacing:.14em; font-weight:700;
    color:var(--nejm-red); text-transform:uppercase; margin-bottom:2px;
  }
  h1.title{
    font-family:'Noto Serif TC', serif;
    font-weight:800;
    font-size:22px;
    line-height:1.25;
    margin:0;
    color:var(--ink);
    letter-spacing:.01em;
  }

  /* ---------- Search ---------- */
  .search-wrap{
    background:var(--paper); padding:10px 16px 8px;
  }
  .search-inner{max-width:720px; margin:0 auto; position:relative;}
  input.search-box{
    width:100%;
    padding:11px 38px 11px 38px;
    border-radius:9px;
    border:1.4px solid var(--gray-line);
    background:var(--paper-card);
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    -webkit-appearance:none;
    appearance:none;
  }
  input.search-box:focus{ border-color:var(--nejm-red); }
  .search-icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    font-size:15px; color:var(--gray); pointer-events:none;
  }
  .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:var(--gray-line); color:var(--ink-soft); border:none;
    width:24px; height:24px; border-radius:50%; font-size:13px; line-height:1;
    display:none; align-items:center; justify-content:center; cursor:pointer;
  }
  .search-hint{
    max-width:720px; margin:6px auto 0; font-size:12px; color:var(--gray);
    display:none; padding:0 2px;
  }

  /* ---------- Tabs ---------- */
  .tabs-wrap{
    background:var(--paper);
    padding:8px 16px 10px;
    border-bottom:1px solid var(--gray-line);
  }
  .tabs-inner{
    max-width:720px; margin:0 auto;
    display:flex; gap:8px;
  }
  .tab-btn{
    flex:1;
    text-align:center;
    padding:9px 4px;
    border-radius:8px;
    border:1.4px solid var(--gray-line);
    background:var(--paper-card);
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab-btn .tcount{
    display:block; font-weight:500; font-size:10.5px; color:var(--gray); margin-top:1px;
  }
  .tab-btn[data-tab="nmCRPC"].active{ background:var(--c-nmCRPC); border-color:var(--c-nmCRPC); color:#fff; }
  .tab-btn[data-tab="mCSPC"].active{ background:var(--c-mCSPC); border-color:var(--c-mCSPC); color:#fff; }
  .tab-btn[data-tab="mCRPC"].active{ background:var(--c-mCRPC); border-color:var(--c-mCRPC); color:#fff; }
  .tab-btn.active .tcount{ color:rgba(255,255,255,.75); }

  /* ---------- Content ---------- */
  main{max-width:720px; margin:0 auto; padding:14px 14px 8px;}
  .section-label{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:6px 4px 10px;
  }
  .section-label .stitle{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:15px; color:var(--ink);
  }
  .section-label .scount{ font-size:12px; color:var(--gray); font-weight:500; }
  .cat-chip{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em;
    padding:2px 7px; border-radius:5px; margin-right:6px; vertical-align:middle;
  }
  .cat-chip.nmCRPC{ background:var(--c-nmCRPC-tint); color:var(--c-nmCRPC); }
  .cat-chip.mCSPC{ background:var(--c-mCSPC-tint); color:var(--c-mCSPC); }
  .cat-chip.mCRPC{ background:var(--c-mCRPC-tint); color:var(--c-mCRPC); }

  /* ---------- Card ---------- */
  .card{
    background:var(--paper-card);
    border:1px solid var(--gray-line);
    border-left:5px solid var(--gray-line);
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card.cat-nmCRPC{ border-left-color:var(--c-nmCRPC); }
  .card.cat-mCSPC{ border-left-color:var(--c-mCSPC); }
  .card.cat-mCRPC{ border-left-color:var(--c-mCRPC); }

  .card-head{
    padding:14px 14px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    cursor:pointer;
    -webkit-tap-highlight-color:rgba(166,25,46,0.08);
    user-select:none;
    touch-action:manipulation;
  }
  .card-head-left{flex:1; min-width:0;}
  .trial-name{
    font-family:'Noto Serif TC', serif;
    font-weight:800; font-size:17px; line-height:1.3; color:var(--ink);
    margin:0 0 4px 0;
    word-break:keep-all;
  }
  .trial-meta-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px;
    font-size:12px; color:var(--gray); margin-bottom:5px;
  }
  .trial-year{
    font-weight:700; color:var(--ink-soft);
  }
  .dot{ color:var(--gray-line); }
  .trial-regimen{
    font-size:13.5px; color:var(--ink-soft); font-weight:600;
    line-height:1.4;
  }
  .status-badge{
    flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding-top:2px;
  }
  .status-icon{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:900; color:#fff;
  }
  .status-icon.positive{ background:var(--green); }
  .status-icon.negative{ background:#9A2E2E; }
  .status-text{
    font-size:9.5px; font-weight:700; letter-spacing:.03em;
  }
  .status-text.positive{ color:var(--green); }
  .status-text.negative{ color:#9A2E2E; }
  .chevron{
    margin-left:2px; color:var(--gray); font-size:12px;
    transition:transform .2s ease; flex-shrink:0; align-self:center;
  }
  .card.expanded .chevron{ transform:rotate(180deg); }

  .card-body{
    display:none;
    padding:2px 14px 16px;
    border-top:1px dashed var(--gray-line);
  }
  .card.expanded .card-body{ display:block; }

  .blk{
    margin-top:14px;
    border-radius:8px;
    padding:10px 12px 11px;
  }
  .blk-title{
    display:flex; align-items:center; gap:6px;
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700; font-size:12.5px;
    letter-spacing:.02em;
    margin-bottom:7px;
  }
  .blk ul{ margin:0; padding-left:18px; }
  .blk li{
    font-size:14px; line-height:1.62; color:var(--ink); margin-bottom:5px;
  }
  .blk li:last-child{ margin-bottom:0; }
  .blk li strong{ color:var(--nejm-red-dark); font-weight:700; }
  .blk.neutral{ background:var(--paper-alt); }
  .blk.neutral .blk-title{ color:var(--ink-soft); }
  .blk.outcome{ background:var(--nejm-red-tint); }
  .blk.outcome .blk-title{ color:var(--nejm-red-dark); }
  .blk.outcome li strong{ color:var(--nejm-red-dark); }
  .blk.importance{ background:var(--amber-tint); border:1px solid #EBD9A8; }
  .blk.importance .blk-title{ color:var(--amber); }
  .blk.updates{ background:var(--blue-tint); }
  .blk.updates .blk-title{ color:var(--blue); }
  .blk.followup{
    background:var(--green-tint); display:flex; align-items:center; gap:8px;
    padding:10px 12px;
  }
  .blk.followup .blk-title{ margin-bottom:0; color:var(--green); }
  .blk.followup .fu-value{ font-size:14px; font-weight:700; color:var(--ink); }

  .no-results{
    text-align:center; padding:50px 20px; color:var(--gray);
  }
  .no-results .nr-icon{ font-size:34px; margin-bottom:10px; }
  .no-results .nr-text{ font-size:14px; }

  footer.foot{
    max-width:720px; margin:20px auto 0; padding:14px 16px 6px;
    border-top:1px solid var(--gray-line);
    font-size:11px; color:var(--gray); line-height:1.6;
  }
</style>
</head>
<body>

<div class="sticky-top">
  <header class="masthead">
    <div class="masthead-inner">
      <div class="kicker">Genitourinary Oncology · Evidence Digest</div>
      <h1 class="title">Prostate Cancer Clinical Trial</h1>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search-inner">
      <span class="search-icon">🔍</span>
      <input id="searchInput" class="search-box" type="text" inputmode="search"
        placeholder="搜尋試驗名稱、藥物、regimen 關鍵字…" autocomplete="off">
      <button class="clear-btn" id="clearBtn" aria-label="清除搜尋">✕</button>
    </div>
    <div class="search-hint" id="searchHint"></div>
  </div>

  <div class="tabs-wrap">
    <div class="tabs-inner" id="tabsInner"></div>
  </div>
</div>

<main id="mainContent"></main>

<footer class="foot">
  資料整理自臨床試驗文獻摘要，僅供學術與臨床參考，非取代原始文獻或臨床指引判讀。HR＝Hazard Ratio；OS＝Overall Survival；rPFS＝Radiographic Progression-Free Survival；MFS＝Metastasis-Free Survival；ARTA/ARPI＝雄性素受體路徑抑制劑；HRR＝同源重組修復基因。
</footer>

<script>

lusion":["docetaxel 後惡化之 mCRPC","68Ga-PSMA-11 PET/CT 高 PSMA 表現（SUVmax ≥20）且 18F-FDG PET/CT 無不一致病灶（雙 PET 篩選）","ECOG PS 0–2"],"exclusion":["存在 FDG 陽性／PSMA 陰性轉移病灶（不一致疾病）","曾接受 Cabazitaxel 或放射性藥物治療"],"outcome":["**Primary Endpoint：PSA 反應率（≥50% 下降）**","PSA 反應率：66%（177Lu-PSMA-617）vs. 37%（Cabazitaxel）（差異 29%；95% CI 16–42%；p<0.0001）","關鍵次要終點：rPFS 有利於 177Lu-PSMA-617（HR 0.63；p=0.0028）；Grade 3–4 不良事件 33%（Lu-PSMA）vs. 53%（Cabazitaxel）"],"followup":"35.7 個月（Final OS Analysis）","importance":["首個 Head-to-Head 比較 RLT 與現行標準化療（Cabazitaxel）的臨床試驗——證實 177Lu-PSMA-617 具更優異的 PSA 腫瘤反應率與更佳安全性/生活品質","建立「FDG/PSMA 雙 PET/CT 掃描」篩選最適治療病患群之精準診斷標準"],"updates":["Final OS analysis（Lancet Oncol 2022）：兩組 OS 相近（19.1 vs. 19.6 個月；HR 0.97；p=0.82），因高交叉使用比例及嚴格雙 PET 篩選族群而屬預期結果"]},{"cat":"mCRPC","name":"PSMAfore","year":"2023 / 2024","status":"positive","regimenShort":"177Lu-PSMA-617 vs. ARTA 換用（chemo-naive）","phase":"Phase 3","arms":["實驗組：177Lu-PSMA-617（n=234）","對照組：換用另一 ARTA（Abiraterone 或 Enzalutamide）（n=234）","隨機分配比例 1:1"],"regimen":["177Lu-PSMA-617 7.4 GBq（200 mCi）IV，每 6 週一次，最多 6 個療程","ARTA 換用：由先前 abiraterone 換為 enzalutamide，或反之"],"inclusion":["68Ga-PSMA-11 PET/CT 確認 PSMA 陽性 mCRPC","先前一種 ARTA 治療後疾病惡化","mCRPC 階段未曾接受紫杉醇化療（若 (m)HSPC 階段曾用 docetaxel，須完成逾 12 個月）","適合換用 ARTA 之候選患者"],"exclusion":["mCRPC 階段曾接受化療","PET 影像顯示不一致、無 PSMA 表現之病灶","曾接受 PARP 抑制劑或放射性藥物治療"],"outcome":["**Primary Endpoint：rPFS**","結果：12.0 vs. 5.6 個月（**HR 0.43**；95% CI 0.33–0.54；p<0.0001），進展/死亡風險降低 57%","關鍵次要終點：PSA 反應率（≥50%）78% vs. 43%"],"followup":"24.1 個月","importance":["將 177Lu-PSMA-617（Pluvicto）治療順序大幅前移至化療前——證明 ARTA 失敗後、尚未化療之 mCRPC 患者中，177Lu-PSMA 療效遠優於傳統 ARTA 互相轉換","改變化療前 mCRPC 第二線治療策略格局"],"updates":["OS 數據因高交叉使用（84% 對照組於 rPFS 後交叉至 177Lu-PSMA-617）呈現未調整 HR 約 0.98；交叉調整後之 OS 分析顯示明確有利於 177Lu-PSMA 之 OS 獲益"]},{"cat":"mCRPC","name":"TALAPRO-2","year":"2023","status":"positive","regimenShort":"Talazoparib + Enzalutamide（1L mCRPC）","phase":"Phase 3","arms":["實驗組：Talazoparib + Enzalutamide（Cohort 1 n=402）","對照組：Placebo + Enzalutamide（Cohort 1 n=403）","隨機分配比例 1:1"],"regimen":["Talazoparib 0.5 mg PO QD（中度腎功能不全者降為 0.35 mg QD）","Enzalutamide 160 mg PO QD","Placebo：對應每日口服膠囊"],"inclusion":["無症狀或輕微症狀之第一線（1L）mCRPC","mCRPC 階段化療未曾使用且 ARTA 未曾使用","Cohort 1：未依 HRR 基因狀態篩選（All-comers）；Cohort 2：前瞻性篩選之 HRR 基因突變族群（BRCA1/2、ATM、CDK12 等）"],"exclusion":["曾接受 PARP 抑制劑、Enzalutamide、Abiraterone 或 mCRPC 化療治療","嚴重心臟或胃腸道疾患"],"outcome":["**Primary Endpoint：blinded independent central review 評估之 rPFS**","結果（All-comers Cohort 1）：Median rPFS Not Reached vs. 21.9 個月（**HR 0.63**；95% CI 0.51–0.78；p<0.001）","結果（HRR-mutated Cohort 2）：Median rPFS Not Reached vs. 13.8 個月（**HR 0.45**；95% CI 0.33–0.61；p<0.001）；BRCA-mutated 亞群 HR 0.20"],"followup":"24.9 個月（Cohort 1）","importance":["確立「PARP 抑制劑 + AR 阻斷劑」聯合雙標靶治療於 1L mCRPC 的協同效應——證實 Talazoparib（Talzenna）加上 Enzalutamide 能顯著延長第一線 mCRPC rPFS，尤其於 HRR/BRCA 突變患者呈現爆發性效益","促成 PARP 抑制劑首度進入 mCRPC 第一線合併療法"],"updates":["OS 數據尚未成熟但呈現有利於合併治療組之趨勢","安全性：貧血為最常見 Grade 3–4 不良事件（47%），以劇量調整及輸血管理，未致高比例治療中斷"]}];

const CATS = [
  {key:'nmCRPC', label:'nmCRPC', full:'非轉移性去勢抗性'},
  {key:'mCSPC',  label:'mCSPC',  full:'轉移性去勢敏感性'},
  {key:'mCRPC',  label:'mCRPC',  full:'轉移性去勢抗性'}
];

let state = { tab: 'nmCRPC', query: '', expanded: new Set() };

function esc(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function md(s){
  let e = esc(s);
  e = e.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return e;
}
function bulletBlock(title, icon, items, cls){
  if(!items || !items.length) return '';
  const lis = items.map(i => `<li>${md(i)}</li>`).join('');
  return `<div class="blk ${cls}">
    <div class="blk-title"><span>${icon}</span><span>${title}</span></div>
    <ul>${lis}</ul>
  </div>`;
}

function matchesQuery(t, q){
  if(!q) return true;
  const hay = [
    t.name, t.regimenShort, t.phase,
    ...(t.arms||[]), ...(t.regimen||[]), ...(t.inclusion||[]),
    ...(t.exclusion||[]), ...(t.outcome||[]), t.followup,
    ...(t.importance||[]), ...(t.updates||[])
  ].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function renderTabs(){
  const wrap = document.getElementById('tabsInner');
  wrap.innerHTML = CATS.map(c => {
    const n = TRIALS.filter(t=>t.cat===c.key).length;
    const active = (state.tab===c.key && !state.query) ? 'active' : '';
    return `<button class="tab-btn ${active}" data-tab="${c.key}" type="button">
      ${c.label}<span class="tcount">${n} trials</span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.tab = btn.dataset.tab;
      const si = document.getElementById('searchInput');
      si.value=''; state.query='';
      updateClearBtn();
      renderTabs();
      renderContent();
    });
  });
}

function cardHTML(t, idx){
  const id = 'trial-' + idx;
  const isOpen = state.expanded.has(id);
  const isPos = t.status === 'positive';
  const showCat = !!state.query;
  return `
  <div class="card cat-${t.cat} ${isOpen?'expanded':''}" data-id="${id}">
    <div class="card-head" data-toggle="${id}">
      <div class="card-head-left">
        <div class="trial-name">${showCat? `<span class="cat-chip ${t.cat}">${t.cat}</span>`:''}${esc(t.name)}</div>
        <div class="trial-meta-row">
          <span class="trial-year">${esc(t.year)}</span>
          <span class="dot">•</span>
          <span>${esc(t.phase)}</span>
        </div>
        <div class="trial-regimen">${esc(t.regimenShort)}</div>
      </div>
      <div class="status-badge">
        <div class="status-icon ${isPos?'positive':'negative'}">${isPos?'✓':'✕'}</div>
        <div class="status-text ${isPos?'positive':'negative'}">${isPos?'POSITIVE':'NEGATIVE'}</div>
      </div>
      <div class="chevron">▼</div>
    </div>
    <div class="card-body">
      ${bulletBlock('Treatment Arms（含 Control）','👥', t.arms, 'neutral')}
      ${bulletBlock('Regimen — 劑量／用法／Cycle','💊', t.regimen, 'neutral')}
      ${bulletBlock('Inclusion Criteria','✅', t.inclusion, 'neutral')}
      ${bulletBlock('Exclusion Criteria','🚫', t.exclusion, 'neutral')}
      ${bulletBlock('Primary Outcome &amp; Results','🎯', t.outcome, 'outcome')}
      <div class="blk followup">
        <div class="blk-title"><span>⏱️</span><span>平均 Follow-up</span></div>
        <div class="fu-value">${esc(t.followup)}</div>
      </div>
      ${bulletBlock('Trial 的重要性及影響','⭐', t.importance, 'importance')}
      ${bulletBlock('重要更新／追蹤報告','📌', t.updates, 'updates')}
    </div>
  </div>`;
}

function renderContent(){
  const main = document.getElementById('mainContent');
  const hint = document.getElementById('searchHint');
  let list;
  let headerHTML = '';

  if(state.query){
    list = TRIALS.filter(t => matchesQuery(t, state.query));
    hint.style.display = 'block';
    hint.textContent = `已跨 nmCRPC／mCSPC／mCRPC 全部類別搜尋 "${state.query}"`;
    headerHTML = `<div class="section-label">
        <span class="stitle">搜尋結果</span>
        <span class="scount">${list.length} 筆符合</span>
      </div>`;
  } else {
    list = TRIALS.filter(t => t.cat === state.tab);
    hint.style.display = 'none';
    const catInfo = CATS.find(c=>c.key===state.tab);
    headerHTML = `<div class="section-label">
        <span class="stitle">${catInfo.label}　${catInfo.full}前列腺癌</span>
        <span class="scount">${list.length} trials</span>
      </div>`;
  }

  if(list.length === 0){
    main.innerHTML = headerHTML + `<div class="no-results">
      <div class="nr-icon">🔎</div>
      <div class="nr-text">找不到符合的試驗，請嘗試其他關鍵字</div>
    </div>`;
    return;
  }

  main.innerHTML = headerHTML + list.map((t,i)=>cardHTML(t, TRIALS.indexOf(t))).join('');

  main.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle');
      const cardEl = el.closest('.card');
      if(state.expanded.has(id)){
        state.expanded.delete(id);
        cardEl.classList.remove('expanded');
      } else {
        state.expanded.add(id);
        cardEl.classList.add('expanded');
      }
    });
  });
}

function updateClearBtn(){
  const cb = document.getElementById('clearBtn');
  cb.style.display = state.query ? 'flex' : 'none';
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  state.query = e.target.value.trim();
  updateClearBtn();
  renderTabs();
  renderContent();
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  const si = document.getElementById('searchInput');
  si.value=''; state.query='';
  si.focus();
  updateClearBtn();
  renderTabs();
  renderContent();
});

renderTabs();
renderContent();
</script>
</body>
</html>
