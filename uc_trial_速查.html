<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>UC Trial 速查</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --first:#0369A1;
  --second:#7C3AED;
  --local:#0F766E;
  --utuc:#B45309;
  --bg:#F8F9FB;--card:#FFFFFF;--border:#E2E8F0;--border2:#CBD5E1;
  --text:#0F172A;--sub:#475569;--muted:#94A3B8;
  --r:14px;--shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04)
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}

.header{background:#fff;border-bottom:1.5px solid var(--border);padding:14px 14px 8px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#0369A1 0%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;font-size:18px}
.header-title{font-size:16px;font-weight:700;color:var(--text);line-height:1.3}
.header-title span{font-size:11.5px;font-weight:400;color:var(--muted);display:block;margin-top:2px}
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--first)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}

/* TOP TABS — 3 domains */
.top-tabs{display:flex;gap:5px}
.top-tab{flex:1;padding:8px 4px;border-radius:10px;font-size:11.5px;font-weight:700;border:1.5px solid var(--border2);background:var(--bg);color:var(--sub);cursor:pointer;text-align:center;transition:all .15s;font-family:'DM Mono',monospace;line-height:1.35;user-select:none}
.top-tab.on.t-first{background:#EFF6FF;border-color:var(--first);color:var(--first)}
.top-tab.on.t-second{background:#F5F3FF;border-color:var(--second);color:var(--second)}
.top-tab.on.t-local{background:#F0FDFA;border-color:var(--local);color:var(--local)}

.main{padding:10px 12px 88px}
.count{font-size:12px;color:var(--muted);margin-bottom:8px;padding:0 2px}

/* SECTION HEADER */
.sec-group{padding:16px 2px 6px}
.sec-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;padding:6px 14px 6px 10px;border-radius:8px}
.sbg-first{background:#DBEAFE;color:var(--first)}
.sbg-second{background:#EDE9FE;color:var(--second)}
.sbg-local{background:#CCFBF1;color:var(--local)}
.sbg-utuc{background:#FEF3C7;color:var(--utuc)}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;border:1.5px solid var(--border)}
.card.hidden{display:none}
.card-head{padding:13px 13px 9px;cursor:pointer;display:grid;grid-template-columns:6px 1fr auto;gap:11px;align-items:start;user-select:none}
.card-head:active{background:#F8F9FB}
.stage-bar{width:6px;border-radius:3px;min-height:34px;margin-top:2px;flex-shrink:0}
.bar-first{background:var(--first)}
.bar-second{background:var(--second)}
.bar-local{background:var(--local)}
.bar-utuc{background:var(--utuc)}

.card-meta{min-width:0}
.card-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.3px;line-height:1.3}
.card-sub{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.result-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.rd-pos{background:#16A34A}
.rd-neg{background:#DC2626}
.stage-tag{font-size:10.5px;font-family:'DM Mono',monospace;font-weight:600;padding:2px 7px;border-radius:5px}
.tag-first{background:#DBEAFE;color:var(--first)}
.tag-second{background:#EDE9FE;color:var(--second)}
.tag-local{background:#CCFBF1;color:var(--local)}
.tag-utuc{background:#FEF3C7;color:var(--utuc)}
.chevron{color:var(--muted);font-size:20px;transition:transform .22s;margin-top:1px}
.chevron.open{transform:rotate(180deg)}

.chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 13px 11px 31px}
.chip{font-size:11.5px;font-family:'DM Mono',monospace;font-weight:500;padding:3px 9px;border-radius:6px;border:1.5px solid var(--border2);color:var(--sub);background:var(--bg)}
.chip.good{border-color:#16A34A;background:#F0FDF4;color:#15803D}
.chip.warn{border-color:#CA8A04;background:#FEFCE8;color:#A16207}
.chip.info{border-color:#2563EB;background:#EFF6FF;color:#1D4ED8}
.chip.neg{border-color:#DC2626;background:#FFF5F5;color:#B91C1C}

/* CARD BODY */
.card-body{display:none;border-top:1.5px solid var(--border)}
.card-body.open{display:block}
.section{padding:13px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none}
.sec-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.sec-label-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sec-text{font-size:13.5px;color:var(--sub);line-height:1.65}
.sec-text strong{color:var(--text);font-weight:600}
.regimen-box{background:#F8F9FB;border:1.5px solid var(--border2);border-radius:10px;padding:11px 13px}
.regimen-row{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.regimen-row:last-child{margin-bottom:0}
.regimen-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.regimen-val{font-size:13.5px;color:var(--text);line-height:1.6}
.regimen-divider{height:1px;background:var(--border);margin:7px 0}
.outcome-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);gap:8px}
.outcome-row:last-child{border-bottom:none;padding-bottom:0}
.out-label{font-size:12.5px;color:var(--sub);flex:1;line-height:1.4}
.out-val{font-size:13.5px;font-weight:700;font-family:'DM Mono',monospace;text-align:right;flex-shrink:0;max-width:55%}
.out-val.pos{color:#15803D}
.out-val.neu{color:#A16207}
.out-val.neg{color:#B91C1C}
.ae-box{background:#FFFBEB;border:1.5px solid #FCD34D;border-radius:10px;padding:11px 13px}
.ae-text{font-size:13.5px;color:#78350F;line-height:1.65}

/* POSITIVE CONCLUSION */
.conclusion{background:linear-gradient(135deg,#EFF6FF 0%,#F0F9FF 100%);border-top:3px solid #2563EB;padding:14px 13px}
.conclusion-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#2563EB;margin-bottom:9px}
.conclusion-text{font-size:13.5px;color:#1E3A5F;line-height:1.75}
.conclusion-text strong{color:#1E40AF}
.importance{background:#F5F3FF;border:1.5px solid #C4B5FD;border-radius:10px;padding:10px 12px;margin-top:11px}
.imp-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7C3AED;margin-bottom:5px}
.imp-text{font-size:12.5px;color:#4C1D95;line-height:1.65}
.landmark{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;margin-top:11px;background:#DBEAFE;color:#1D4ED8;border:1.5px solid #93C5FD}

/* NEGATIVE CONCLUSION */
.neg-banner{background:#FFF5F5;border-top:3px solid #DC2626;padding:14px 13px}
.neg-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#DC2626;margin-bottom:9px}
.neg-text{font-size:13.5px;color:#7F1D1D;line-height:1.75}
.neg-text strong{color:#991B1B}
.neg-lesson{background:#FEE2E2;border:1.5px solid #FECACA;border-radius:10px;padding:10px 12px;margin-top:11px}
.neg-lesson-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#B91C1C;margin-bottom:5px}
.neg-lesson-text{font-size:12.5px;color:#7F1D1D;line-height:1.65}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1.5px solid var(--border);padding:8px 12px 12px;box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:200}
.bn-row{display:flex;gap:5px;margin-bottom:5px}
.bn-row:last-child{margin-bottom:0}
.bn-btn{flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid var(--border);font-size:11px;font-family:'DM Mono',monospace;font-weight:700;cursor:pointer;background:var(--bg);color:var(--sub);transition:all .15s;text-align:center;line-height:1.3}
.bn-btn:active{opacity:.7;transform:scale(.97)}
.bn-first{color:var(--first);border-color:#BAE6FD;background:#F0F9FF}
.bn-second{color:var(--second);border-color:#C4B5FD;background:#F5F3FF}
.bn-local{color:var(--local);border-color:#99F6E4;background:#F0FDFA}

.no-results{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;display:none}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="logo">🫧</div>
    <div class="header-title">UC Trial 速查<span>13 trials · mUC 1L / 2L · Locally Advanced</span></div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="搜尋 trial 名稱、藥物..." oninput="filter()">
  </div>
  <div class="top-tabs">
    <div class="top-tab t-first on" onclick="setDomain('first')">mUC<br>1st Line</div>
    <div class="top-tab t-second" onclick="setDomain('second')">mUC<br>2nd Line</div>
    <div class="top-tab t-local" onclick="setDomain('local')">Locally<br>Advanced</div>
  </div>
</div>

<div class="main">
  <div class="count" id="count"></div>
  <div id="list"></div>
  <div class="no-results" id="noResult">找不到符合條件的 trial</div>
</div>

<div class="bottom-nav">
  <div class="bn-row">
    <button class="bn-btn bn-first" onclick="setDomain('first')">mUC 1st Line</button>
    <button class="bn-btn bn-second" onclick="setDomain('second')">mUC 2nd Line</button>
    <button class="bn-btn bn-local" onclick="setDomain('local')">Locally Advanced</button>
  </div>
</div>

<script>
const DATA = [

{name:"EV-302 / KEYNOTE-A39", year:2024, domain:"first", result:"pos",

// ─────────────────────────────────────────
//  STATE & CONFIG
// ─────────────────────────────────────────
let activeDomain = "first";

const DOMAIN_CONFIG = {
  first: {
    label: "mUC 1st Line",
    groups: [{key:"first", label:"1st Line Treatment", icon:"◉", badgeCls:"sbg-first"}]
  },
  second: {
    label: "mUC 2nd Line",
    groups: [{key:"second", label:"2nd Line / Salvage Treatment", icon:"◆", badgeCls:"sbg-second"}]
  },
  local: {
    label: "Locally Advanced",
    groups: [
      {key:"ubuc", label:"UBUC — Bladder Cancer", icon:"⬡", badgeCls:"sbg-local"},
      {key:"utuc", label:"UTUC — Upper Tract UC", icon:"⬟", badgeCls:"sbg-utuc"}
    ]
  }
};

// ─────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────
function buildCards() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const cfg = DOMAIN_CONFIG[activeDomain];

  cfg.groups.forEach(grp => {
    const anchor = document.createElement("div");
    anchor.className = "sec-group";
    anchor.id = "anchor-" + grp.key;
    anchor.innerHTML = `<div class="sec-badge ${grp.badgeCls}"><span>${grp.icon}</span>${grp.label}</div>`;
    list.appendChild(anchor);

    const trials = DATA.filter(t =>
      t.domain === activeDomain &&
      (activeDomain !== "local" || (t.sub||"ubuc") === grp.key)
    );

    trials.forEach((trial, idx) => {
      const uid = grp.key + "_" + idx;
      const barCls = activeDomain === "local" ? (grp.key === "utuc" ? "bar-utuc" : "bar-local") :
                     activeDomain === "first" ? "bar-first" : "bar-second";
      const tagCls = activeDomain === "local" ? (grp.key === "utuc" ? "tag-utuc" : "tag-local") :
                     activeDomain === "first" ? "tag-first" : "tag-second";

      const card = document.createElement("div");
      card.className = "card";
      card.dataset.domain = trial.domain;
      card.dataset.sub = trial.sub || trial.domain;
      card.dataset.search = [trial.name, trial.inclusion, trial.regimen.exp,
        trial.regimen.ctrl||"", trial.conclusion, trial.importance].join(" ").toLowerCase();

      const chipsHtml = trial.chips.map(c => `<span class="chip ${c.c}">${c.t}</span>`).join("");
      const outHtml = trial.outcomes.map(o =>
        `<div class="outcome-row"><span class="out-label">${o.l}</span><span class="out-val ${o.t}">${o.v}</span></div>`
      ).join("");
      const rdot = `<span class="result-dot rd-${trial.result}"></span>`;

      const conclusionBlock = trial.result === "neg" ? `
        <div class="neg-banner">
          <div class="neg-lbl">✕ Negative Trial</div>
          <div class="neg-text">${trial.conclusion}</div>
          <div class="neg-lesson">
            <div class="neg-lesson-lbl">📌 重要啟示</div>
            <div class="neg-lesson-text">${trial.importance}</div>
          </div>
        </div>` : `
        <div class="conclusion">
          <div class="conclusion-lbl">✦ 臨床總結</div>
          <div class="conclusion-text">${trial.conclusion}</div>
          <div class="importance">
            <div class="imp-lbl">🏛 Trial 重要性</div>
            <div class="imp-text">${trial.importance}</div>
          </div>
          <div class="landmark">★ ${trial.chips[0].t}</div>
        </div>`;

      card.innerHTML = `
        <div class="card-head" onclick="toggle('B${uid}','C${uid}')">
          <div class="stage-bar ${barCls}"></div>
          <div class="card-meta">
            <div class="card-name">${trial.name}</div>
            <div class="card-sub">
              ${rdot}
              <span class="stage-tag ${tagCls}">${trial.tag}</span>
              <span>${trial.year}</span>
              <span style="color:#CBD5E1">·</span>
              <span>F/U: ${trial.followUp}</span>
            </div>
          </div>
          <div class="chevron" id="C${uid}">⌄</div>
        </div>
        <div class="chips">${chipsHtml}</div>
        <div class="card-body" id="B${uid}">
          <div class="section">
            <div class="sec-label"><span class="sec-label-dot" style="background:#3B82F6"></span>入組條件 Inclusion</div>
            <div class="sec-text">${trial.inclusion}</div>
          </div>
          <div class="section">
            <div class="sec-label"><span class="sec-label-dot" style="background:#EF4444"></span>排除條件 Exclusion</div>
            <div class="sec-text">${trial.exclusion}</div>
          </div>
          <div class="section">
            <div class="sec-label"><span class="sec-label-dot" style="background:#F59E0B"></span>治療方案 Regimen</div>
            <div class="regimen-box">
              <div class="regimen-row"><div class="regimen-label">💊 實驗組</div><div class="regimen-val">${trial.regimen.exp}</div></div>
              <div class="regimen-row"><div class="regimen-label">📅 給藥頻率 / 週期</div><div class="regimen-val">${trial.regimen.schedule}</div></div>
              <div class="regimen-row"><div class="regimen-label">⏱ 總療程</div><div class="regimen-val">${trial.regimen.duration}</div></div>
              <div class="regimen-divider"></div>
              <div class="regimen-row"><div class="regimen-label">🔲 對照組</div><div class="regimen-val" style="color:#64748B">${trial.regimen.ctrl||'無（單臂試驗）'}</div></div>
            </div>
          </div>
          <div class="section">
            <div class="sec-label"><span class="sec-label-dot" style="background:#10B981"></span>主要成效（Primary: ${trial.primary}）</div>
            ${outHtml}
          </div>
          <div class="section">
            <div class="sec-label"><span class="sec-label-dot" style="background:#F59E0B"></span>⚠ 主要副作用</div>
            <div class="ae-box"><div class="ae-text">${trial.ae}</div></div>
          </div>
          ${conclusionBlock}
        </div>`;
      list.appendChild(card);
    });
  });
  filter();
}

function toggle(bId, cId) {
  const b = document.getElementById(bId);
  const c = document.getElementById(cId);
  if (!b) return;
  b.classList.toggle("open");
  if (c) c.classList.toggle("open");
}

function setDomain(d) {
  activeDomain = d;
  document.querySelectorAll(".top-tab").forEach(t => t.classList.remove("on"));
  document.querySelector(".top-tab.t-" + d).classList.add("on");
  document.getElementById("search").value = "";
  buildCards();
  window.scrollTo({top: 0, behavior: "smooth"});
}

function filter() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let shown = 0;
  document.querySelectorAll(".card").forEach(c => {
    const ok = !q || c.dataset.search.includes(q);
    c.classList.toggle("hidden", !ok);
    if (ok) shown++;
  });
  document.querySelectorAll(".sec-group").forEach(a => {
    const key = a.id.replace("anchor-", "");
    const vis = [...document.querySelectorAll(".card")].some(c =>
      !c.classList.contains("hidden") &&
      (c.dataset.sub === key || c.dataset.domain === key)
    );
    a.style.display = vis ? "" : "none";
  });
  const nr = document.getElementById("noResult");
  if (nr) nr.style.display = shown > 0 ? "none" : "block";
  const total = DATA.filter(t => t.domain === activeDomain).length;
  document.getElementById("count").textContent = `顯示 ${shown} / ${total} 項 trial`;
}

buildCards();
</script>
</body>
</html>
